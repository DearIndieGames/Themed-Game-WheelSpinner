<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Game Wheel (curated)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#777;--accent:#3b6fd4;--card:rgba(255,255,255,.85);--bg2:#fff;--bg3:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f2f2f2;--muted:#999;--card:rgba(30,30,30,.85)}}
:root[data-theme="dark"]{--bg:#111;--fg:#f2f2f2;--muted:#999;--card:rgba(30,30,30,.85)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
body.themed{background:linear-gradient(160deg,var(--bg2),var(--bg3));transition:background .6s}
body.themed.winter{--card:rgba(255,255,255,.78);--bg2:#dff0fb;--bg3:#a9c7e8;--fg:#17324d;--accent:#2f6fb0}
body.themed.spring{--card:rgba(255,255,255,.78);--bg2:#fdeef4;--bg3:#bfe6c4;--fg:#3b2a3a;--accent:#d9568a}
body.themed.summer{--card:rgba(255,255,255,.78);--bg2:#fff3b8;--bg3:#7fd6e8;--fg:#17394a;--accent:#f08a1c}
body.themed.autumn{--card:rgba(255,255,255,.78);--bg2:#fbe3b8;--bg3:#d9823b;--fg:#43210f;--accent:#b4491c}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:5}
#start input{font:inherit;font-size:clamp(1.6rem,6vw,2.6rem);text-align:center;border:0;border-bottom:2px solid var(--muted);background:transparent;color:var(--fg);outline:none;width:min(80vw,520px);padding:.4em}
#start input:focus{border-color:var(--accent)}
/* Spotlight pills: a wrapping row of buttons under the hint */
/* Spotlight pills. The font stack falls back to similar geometric fonts if League Spartan can't load. */
#spotsHead,#spots button{font-family:"League Spartan","Montserrat","Futura","Century Gothic",system-ui,sans-serif;text-transform:uppercase}
#spotsHead{margin:calc(20px + 1.33rem) 0 0;font-size:1.7rem;font-weight:800;letter-spacing:.14em;color:var(--fg);text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:3px}
#spots{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:16px;max-width:min(94vw,820px)}
#spots button{font-size:1.2rem;font-weight:800;letter-spacing:.06em;line-height:1;border:1px solid rgba(255,255,255,.14);
  background:#1d1b22;border-radius:99px;padding:14px 24px 11px;cursor:pointer;   /* solid charcoal pill */
  box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .15s,box-shadow .15s}
#spots button:hover,#spots button:focus-visible{transform:translateY(-2px);box-shadow:0 5px 12px rgba(0,0,0,.28);outline:none}
#spots button:focus-visible{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}   /* visible ring for keyboard users */
#spots button:disabled{filter:grayscale(1);opacity:.5;cursor:default;transform:none}
/* Gradient lettering: the gradient is painted as the span's background, then "clipped" to the
   shape of the letters, and the text colour is made transparent so the gradient shows through. */
#spots button span{background-clip:text;-webkit-background-clip:text;color:transparent}
/* Spotlight pill colours: brightened versions of each community's colours so they read on the dark pill */
.spot-black span{background-image:linear-gradient(90deg,#ff4d5e,#ffc93c,#2ecc71)}                 /* Pan-African red, gold, green */
.spot-latam span{background-image:linear-gradient(90deg,#ffb347,#ff6a3d,#ff4f9a)}                 /* warm sunset tones */
.spot-lgbtq span{background-image:linear-gradient(90deg,#ff4d4d,#ffa133,#ffe433,#3ddc6b,#4d8bff,#b56cff)} /* rainbow flag */
.spot-sea span{background-image:linear-gradient(90deg,#3ee0d0,#4fb3ff)}                          /* tropical sea teal to blue */
.spot-women span{background-image:linear-gradient(90deg,#c58cff,#f0a8ff)}                         /* International Women's Day purple */
#start small{margin-top:1.2em;color:var(--muted);font-size:.95rem;text-align:center;max-width:min(80vw,520px);line-height:1.4}
#count{font-size:1.1rem}
#start .tools{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:.8rem;color:var(--muted)}
#start .tools a{color:var(--muted);cursor:pointer;text-decoration:underline}
#app{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:3;font-size:.9rem}
.pill{background:var(--card);border:0;border-radius:99px;padding:8px 14px;color:var(--fg);font:inherit;cursor:pointer;backdrop-filter:blur(6px)}
.info{text-align:right}
.info label{display:block;margin-top:6px;cursor:pointer}
#wrap{position:relative;width:min(92vw,76vh,640px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:var(--accent);color:#fff;font:700 clamp(1rem,4vw,1.6rem) Georgia,serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#spin:active{transform:translate(-50%,-50%) scale(.95)}
#spin:disabled{opacity:.7;cursor:default}
#result{margin-top:14px;min-height:5.2em;text-align:center;padding:0 16px;max-width:90vw}
#result h2{margin:0;font-size:clamp(1.4rem,5vw,2.2rem)}
#result p{margin:.5em 0 0;color:var(--fg);opacity:.75;font-size:.95rem;line-height:1.5}
#result button{margin:18px 4px 4px}   /* gap above "remove & spin again" */
.fx{position:fixed;top:-8vh;pointer-events:none;animation:fall linear infinite;z-index:1;opacity:.8}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:20;padding:16px}
#pop.show{display:flex}
#popcard{position:relative;background:#fffdf8;color:#2a2a2a;border-radius:10px;width:min(94vw,560px);max-height:88vh;overflow:auto;padding:18px 18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.4);box-sizing:border-box}
#pop.show #popcard{animation:bounce .65s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bounce{0%{transform:scale(.3) translateY(80px);opacity:0}55%{transform:scale(1.07);opacity:1}78%{transform:scale(.97)}100%{transform:scale(1)}}
#popcard h2{margin:0 28px 4px 0;font-size:1.35rem;line-height:1.25}
#popcard .pd{opacity:.7;margin-bottom:12px}
#popcard .vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:8px}
#popcard .vid iframe,#popcard .vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
#popcard a{color:var(--accent);font-weight:700}
#popcard .desc{line-height:1.5;margin:12px 0 0}
#popcard .sm{font-size:.8rem;opacity:.7;margin:0 0 6px}
#popcard .x{position:absolute;top:6px;right:10px;border:0;background:transparent;color:#2a2a2a;font-size:1.7rem;cursor:pointer;line-height:1}
#live{position:absolute;top:calc(env(safe-area-inset-top,0px) + 78px);left:50%;transform:translateX(-50%);background:var(--card);padding:11px 22px;border-radius:99px;max-width:88vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;font-size:1.25rem}
#back{font-size:1.15rem;padding:12px 22px}
#live:empty{display:none}
#terms{margin-top:22px;font-size:.9rem;line-height:1.55;opacity:.85;text-align:center;padding:2px 16px;max-width:min(92vw,860px)}
/* Dev-only keyword report: a full-screen scrollable panel above everything else */
#rep{position:fixed;inset:0;z-index:30;background:var(--bg);color:var(--fg);overflow:auto;padding:16px;box-sizing:border-box;font-size:.9rem}
#rep[hidden]{display:none}
#rep table{border-collapse:collapse;width:100%;max-width:760px;margin:10px auto}
#rep th,#rep td{text-align:left;padding:5px 8px;border-bottom:1px solid rgba(128,128,128,.25)}
#rep th{cursor:pointer;position:sticky;top:0;background:var(--bg)}
#rep td.n{text-align:right;font-variant-numeric:tabular-nums}
#rep .thin{color:#c0392b;font-weight:700}
#rep .big{color:#b7791f;font-weight:700}
#rep .head{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div id="start">
  <input id="kw" list="kwl" type="text" placeholder="Keyword(s)" autocomplete="off" autofocus>
  <datalist id="kwl"></datalist>
  <small id="hint">Tip: add more keywords, separated by commas, to widen the wheel. Press Enter to search.</small>
  <h2 id="spotsHead">SUGGESTIONS</h2>
  <div id="spots" aria-label="Suggested spotlight wheels"></div>
  <div id="pbox" hidden style="margin-top:14px;text-align:center"><textarea id="pj" rows="4" style="width:min(80vw,520px);font-size:.8rem" placeholder="open the sheet link, select all, copy, paste here"></textarea><br><button class="pill" id="pgo">use this data</button></div>
  <div class="tools"><span id="count"></span><span id="dev" hidden> · <a id="sync">sync sheet</a> · <a id="paste">paste JSON</a> · <a id="load">upload file</a> · <a id="reset">use samples</a> · <a id="report">keyword report</a></span>
  <input id="file" type="file" accept=".json,application/json" hidden></div>
</div>
<div id="app">
  <div class="top">
    <button class="pill" id="back">← new keyword</button>
    <div class="info"><div id="stats"></div><label><input type="checkbox" id="rel" checked> include related games</label></div>
  </div>
  <div id="live"></div>
  <div id="wrap"><canvas id="cv"></canvas><button id="spin">SPIN</button></div>
  <div id="result"></div>
  <div id="terms"></div>
  <div id="pop"><div id="popcard"></div></div>
</div>
<div id="rep" hidden></div>

  setTimeout(()=>showPop(g),400);
}
function ytId(u){const m=(u||"").match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m&&m[1]}
function fmtDate(s){
  const m=(s||"").match(/(\d{1,2})\s+([A-Za-z]{3})/);if(!m)return s||"";
  const full=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const i=full.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].toLowerCase());
  return i<0?s:(+m[1])+" "+full[i]+" "+new Date().getFullYear();
}
function hidePop(){$("pop").classList.remove("show");$("popcard").textContent=""}
function showPop(g){
  const c=$("popcard");c.textContent="";
  const add=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;c.appendChild(e);return e};
  add("button","×","x").onclick=hidePop;
  add("h2",g.title+(g.genre?" ("+g.genre+")":""));
  add("div",fmtDate(g.date)||"Release date unknown","pd");
  const id=ytId(g.trailer);
  if(id||/\.mp4/.test(g.trailer||"")){
    const v=add("div",null,"vid");
    if(id){const f=document.createElement("iframe");f.referrerPolicy="strict-origin-when-cross-origin";f.src="https://www.youtube.com/embed/"+id+"?rel=0&playsinline=1"+(location.origin.startsWith("http")?"&origin="+encodeURIComponent(location.origin):"");f.allowFullscreen=true;f.setAttribute("allow","fullscreen; picture-in-picture");f.title="Trailer";v.appendChild(f)}
    else{const m=document.createElement("video");m.src=g.trailer;m.controls=true;m.playsInline=true;v.appendChild(m)}
    if(id){const s=add("p","Video not loading? ","sm");const a=document.createElement("a");a.href=g.trailer;a.target="_blank";a.rel="noopener";a.textContent="Watch on YouTube";s.appendChild(a)}
  }else add("p","No trailer listed for this game.","sm");
  if(/^https?:\/\//.test(g.url||"")){const p=add("p",null);const a=document.createElement("a");a.href=g.url;a.target="_blank";a.rel="noopener";a.textContent="Store page →";p.appendChild(a)}
  add("p",g.description||"No description available.","desc");
  // Spotlight sources, each linking to the page that lists the game or studio
  // e.g. "Made by a Black-led studio · featured in Black Voices in Gaming 2026" (the source is a link)
  for(const l of spotLines(g)){
    const sp=add("p",l.text+" · "+l.verb+" ","sm");const a=document.createElement("a");
    a.href=SOURCES[l.src][1];a.target="_blank";a.rel="noopener";a.textContent=SOURCES[l.src][0];sp.appendChild(a);
  }
  $("pop").classList.add("show");
}
$("pop").onclick=e=>{if(e.target.id==="pop")hidePop()};
$("spin").onclick=spin;
$("rel").onchange=()=>{buildPool();$("result").innerHTML="";draw()};
// ---------- flow ----------
function confetti(){
  document.querySelectorAll(".fx").forEach(e=>e.remove());
  for(let i=0;i<16;i++){
    const s=document.createElement("span");s.className="fx";
    s.textContent=FX[season][i%3];
    s.style.left=Math.random()*100+"vw";s.style.fontSize=(14+Math.random()*18)+"px";
    s.style.animationDuration=(9+Math.random()*10)+"s";s.style.animationDelay=(-Math.random()*15)+"s";
    document.body.appendChild(s);
  }
}
function drawPills(){
  // function declarations are "hoisted", so setGames can call this even though it's written further down
  const box=document.getElementById("spots");box.textContent="";
  // [...SPOT_WHEELS] copies the list so sorting doesn't change the original; localeCompare sorts A to Z
  for(const w of [...SPOT_WHEELS].sort((a,b)=>a.label.localeCompare(b.label))){
    const n=games.filter(g=>inWheel(w,g)).length;
    const b=document.createElement("button");b.type="button";
    b.className="spot-"+w.id;
    const label=document.createElement("span");label.textContent=w.label;b.appendChild(label);
    b.disabled=!n;b.title=n?"Spin a wheel of "+n+" games from "+w.label+" showcases":"No games from these showcases in the list yet";
    b.onclick=()=>{if(!ready){document.getElementById("count").textContent="Still loading the game list, one moment…";return}goSpot(w)};
    box.appendChild(b);
  }
}
// Builds a wheel straight from the spotlight list (no keyword matching at all)
function goSpot(w){
  Q={items:[],base:[w.label]};current=w.label;
  direct=games.filter(g=>inWheel(w,g));related=[];
  games.forEach(g=>g._why="");
  buildPool();
  $("stats").textContent="“"+w.label+"” · "+direct.length+(direct.length===1?" game":" games");
  $("start").style.display="none";$("app").style.display="flex";
  document.body.classList.add("themed");confetti();
  size();$("result").innerHTML="";
  // For groups that allow "about", show the mix so creators know what they're working with
  let mix="";
  if(w.groups.some(g=>ABOUT_GROUPS.includes(g))){
    const isAbout=g=>spotsOf(g).some(([grp,,why])=>w.groups.includes(grp)&&why==="about")&&!spotsOf(g).some(([grp,,why])=>w.groups.includes(grp)&&why==="made");
    const ab=direct.filter(isAbout).length;
    mix=" · "+(direct.length-ab)+" made by · "+ab+" about";
  }
  $("terms").textContent=w.label+" wheel"+mix+" · sources: "+wheelSources(w).join("; ");
  draw();startIdle();
}
function go(k){
  Q=buildQuery(k);
  current=k;search();buildPool();
  $("start").style.display="none";$("app").style.display="flex";
  document.body.classList.add("themed");confetti();
  size();$("result").innerHTML=pool.length?"":"<p>Nothing matched. Try another keyword.</p>";
  const notes=Q.items.filter(i=>i.note).map(i=>i.note);
  const sg=pool.length<8&&Q.items.some(i=>i.e)?suggestions():[];
  $("terms").textContent="Matching: "+Q.base.slice(0,8).join(", ")+(notes.length?" · "+notes.join(" · "):"")+(sg.length?" · Few matches, try: "+sg.join(", "):"");
  draw();startIdle();
}
$("kw").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!$("kw").value.trim())return;
  if(!ready){$("count").textContent="Still loading the game list, one moment…";return}
  go($("kw").value);
});
$("back").onclick=()=>{
  cancelAnimationFrame(raf);spinning=false;$("spin").disabled=false;
  $("app").style.display="none";$("start").style.display="flex";
  document.body.classList.remove("themed");
  document.querySelectorAll(".fx").forEach(e=>e.remove());
  $("kw").value="";$("kw").focus();
};
addEventListener("resize",()=>{if($("app").style.display==="flex"){size();draw()}});
</script>
