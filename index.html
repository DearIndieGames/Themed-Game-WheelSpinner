<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Game Wheel</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#777;--accent:#3b6fd4;--card:rgba(255,255,255,.85);--bg2:#fff;--bg3:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111;--fg:#f2f2f2;--muted:#999;--card:rgba(30,30,30,.85)}}
:root[data-theme="dark"]{--bg:#111;--fg:#f2f2f2;--muted:#999;--card:rgba(30,30,30,.85)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
body.themed{background:linear-gradient(160deg,var(--bg2),var(--bg3));transition:background .6s}
body.themed.winter{--card:rgba(255,255,255,.78);--bg2:#dff0fb;--bg3:#a9c7e8;--fg:#17324d;--accent:#2f6fb0}
body.themed.spring{--card:rgba(255,255,255,.78);--bg2:#fdeef4;--bg3:#bfe6c4;--fg:#3b2a3a;--accent:#d9568a}
body.themed.summer{--card:rgba(255,255,255,.78);--bg2:#fff3b8;--bg3:#7fd6e8;--fg:#17394a;--accent:#f08a1c}
body.themed.autumn{--card:rgba(255,255,255,.78);--bg2:#fbe3b8;--bg3:#d9823b;--fg:#43210f;--accent:#b4491c}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:5}
#start input{font:inherit;font-size:clamp(1.6rem,6vw,2.6rem);text-align:center;border:0;border-bottom:2px solid var(--muted);background:transparent;color:var(--fg);outline:none;width:min(80vw,520px);padding:.4em}
#start input:focus{border-color:var(--accent)}
#start small{margin-top:1.2em;color:var(--muted);font-size:.9rem}
#start .tools{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:.8rem;color:var(--muted)}
#start .tools a{color:var(--muted);cursor:pointer;text-decoration:underline}
#app{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;z-index:3;font-size:.9rem}
.pill{background:var(--card);border:0;border-radius:99px;padding:8px 14px;color:var(--fg);font:inherit;cursor:pointer;backdrop-filter:blur(6px)}
.info{text-align:right}
.info label{display:block;margin-top:6px;cursor:pointer}
#wrap{position:relative;width:min(92vw,76vh,640px);aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24%;aspect-ratio:1;border-radius:50%;border:5px solid #fff;background:var(--accent);color:#fff;font:700 clamp(1rem,4vw,1.6rem) Georgia,serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#spin:active{transform:translate(-50%,-50%) scale(.95)}
#spin:disabled{opacity:.7;cursor:default}
#result{margin-top:14px;min-height:5.2em;text-align:center;padding:0 16px;max-width:90vw}
#result h2{margin:0;font-size:clamp(1.4rem,5vw,2.2rem)}
#result p{margin:.3em 0;color:var(--fg);opacity:.75;font-size:.9rem}
#result button{margin:4px}
.fx{position:fixed;top:-8vh;pointer-events:none;animation:fall linear infinite;z-index:1;opacity:.8}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.fx{display:none}}
#pop{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:20;padding:16px}
#pop.show{display:flex}
#popcard{position:relative;background:#fffdf8;color:#2a2a2a;border-radius:10px;width:min(94vw,560px);max-height:88vh;overflow:auto;padding:18px 18px 20px;box-shadow:0 12px 40px rgba(0,0,0,.4);box-sizing:border-box}
#pop.show #popcard{animation:bounce .65s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bounce{0%{transform:scale(.3) translateY(80px);opacity:0}55%{transform:scale(1.07);opacity:1}78%{transform:scale(.97)}100%{transform:scale(1)}}
#popcard h2{margin:0 28px 4px 0;font-size:1.35rem;line-height:1.25}
#popcard .pd{opacity:.7;margin-bottom:12px}
#popcard .vid{position:relative;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin-bottom:8px}
#popcard .vid iframe,#popcard .vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
#popcard a{color:var(--accent);font-weight:700}
#popcard .desc{line-height:1.5;margin:12px 0 0}
#popcard .sm{font-size:.8rem;opacity:.7;margin:0 0 6px}
#popcard .x{position:absolute;top:6px;right:10px;border:0;background:transparent;color:#2a2a2a;font-size:1.7rem;cursor:pointer;line-height:1}
#live{position:absolute;top:calc(env(safe-area-inset-top,0px) + 62px);left:50%;transform:translateX(-50%);background:var(--card);padding:6px 14px;border-radius:99px;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;font-size:.95rem}
#live:empty{display:none}
#terms{font-size:.75rem;opacity:.85;text-align:center;padding:2px 16px;max-width:92vw}
</style>
</head>
<body>
<div id="start">
  <input id="kw" type="text" placeholder="keyword or month…" autocomplete="off" autofocus>
  <small id="hint">press enter</small>
  <div id="pbox" hidden style="margin-top:14px;text-align:center"><textarea id="pj" rows="4" style="width:min(80vw,520px);font-size:.8rem" placeholder="open the sheet link, select all, copy, paste here"></textarea><br><button class="pill" id="pgo">use this data</button></div>
  <div class="tools"><span id="count"></span> · <a id="sync">sync sheet</a> · <a id="paste">paste JSON</a> · <a id="load">upload file</a> · <a id="reset">use samples</a>
  <input id="file" type="file" accept=".json,application/json" hidden></div>
</div>
<div id="app">
  <div class="top">
    <button class="pill" id="back">← new keyword</button>
    <div class="info"><div id="stats"></div><label><input type="checkbox" id="rel" checked> include related games</label></div>
  </div>
  <div id="live"></div>
  <div id="wrap"><canvas id="cv"></canvas><button id="spin">SPIN</button></div>
  <div id="result"></div>
  <div id="terms"></div>
  <div id="pop"><div id="popcard"></div></div>
</div>
<script>
// ---------- sample data (replaced when you load your own JSON) ----------
const SAMPLE=[
{title:"Don’t Starve Together",genre:"Survival",description:"Survive freezing winters and wild creatures in a hand-drawn world."},
{title:"Stardew Valley",genre:"Farming Sim",description:"Plant crops each season, harvest in autumn and fish in summer."},
{title:"Hades",genre:"Roguelike",description:"Battle out of the underworld with fast action."},
{title:"Subnautica: Below Zero",genre:"Survival",description:"Explore an arctic ocean of ice, snow and frozen caves."},
{title:"Spiritfarer",genre:"Cozy",description:"A gentle boat-building game about caring for spirits."},
{title:"Slay the Spire",genre:"Deckbuilder",description:"Climb a spire fighting monsters with cards."},
{title:"Frostpunk",genre:"City Builder",description:"Keep your city alive through a global blizzard."},
{title:"Animal Crossing: New Horizons",genre:"Life Sim",description:"Seasonal events, snowmen in winter and cherry blossoms in spring."},
{title:"Hollow Knight",genre:"Metroidvania",description:"Explore a ruined insect kingdom."},
{title:"Alba: A Wildlife Adventure",genre:"Adventure",description:"Spend a summer on a Mediterranean island saving wildlife."},
{title:"Phasmophobia",genre:"Horror",description:"Hunt ghosts in haunted houses with friends."},
{title:"The Long Dark",genre:"Survival",description:"Survive in a frozen Canadian wilderness after a disaster."},
{title:"Cult of the Lamb",genre:"Roguelike",description:"Run a woodland cult and spread your word."},
{title:"Wylde Flowers",genre:"Cozy",description:"Farm, brew potions and bloom as a witch in spring."}
];
// ---------- seasons ----------
const M=new Date().getMonth();
const season=M<2||M==11?"winter":M<5?"spring":M<8?"summer":"autumn";
const PAL={winter:["#5b8fc9","#8fb8e3","#3e6ea8","#a9cdea","#6f9bd1","#d8ecf8"],
spring:["#e87aa3","#8fcf9a","#f2b5cf","#5fbf7a","#f7d36b","#b99ae0"],
summer:["#f5a623","#2cb5d6","#ffd23f","#ee6c4d","#3fc1a5","#f78fb3"],
autumn:["#c8561e","#e09a2d","#8c3b14","#d97b3a","#a8692a","#b5382a"]};
const FX={winter:["❄️","❅","❆"],spring:["🌸","🌷","🍃"],summer:["☀️","🌊","🌴"],autumn:["🍂","🍁","🎃"]};
document.body.classList.add(season);
// ---------- related words: Datamuse + Wikipedia (no hand-written theme lists) ----------
const COUNTRY="GB"; // country used for public holidays (Nager.Date); change to e.g. "IE", "DE", "FR"
const MONTHS=["january","february","march","april","may","june","july","august","september","october","november","december"];
const SEASON=["winter","winter","spring","spring","spring","summer","summer","summer","autumn","autumn","autumn","winter"]; // Northern Hemisphere
const OBS={1:["new year","burns night"],2:["valentine","pancake day"],3:["st patrick","easter","mothering sunday"],4:["easter","st george"],10:["halloween"],11:["bonfire night","remembrance"],12:["christmas","new year","hanukkah"]}; // gaps Nager.Date does not cover
const STOP=new Set("the and for with game games play player players world new day days time year years life way man one two get use make good great also like just more most some very can will thing things people place work".split(" "));
function monthIndex(w){w=w.toLowerCase().replace(/\./g,"");if(w==="sept")return 8;return MONTHS.findIndex(m=>m===w||(w.length===3&&m.startsWith(w)))}
const clean=w=>String(w).toLowerCase().replace(/[’']/g,"").trim();
const okWord=w=>w.length>2&&!STOP.has(w)&&/^[a-z][a-z \-]*$/.test(w);
async function getJSON(url,ms=7000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("http");return await r.json()}finally{clearTimeout(t)}}
const cacheGet=k=>{try{const v=JSON.parse(localStorage.getItem(k));if(v&&Date.now()-v.t<6048e5)return v.d}catch(_){}return null};
const cacheSet=(k,d)=>{try{localStorage.setItem(k,JSON.stringify({t:Date.now(),d}))}catch(_){}};
let svc={dm:true,wk:true,nh:true};
const WSTOP=new Set("also first known called often many during most used including however although since between several various part form people country countries states united state british english european western term name named usually around early late became become according major common other another within among period number large small high long place areas area general using given following later began such this that with from have were which their there been they these those into than then them when where while about after before over under more some other only both each most made make well while would could should will your what year years century history time times world used uses use used".split(" "));
const stem=w=>w.replace(/(ies|es|s)$/,"");
async function wikiWords(term){
  const u="https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&generator=search&gsrnamespace=0&gsrlimit=1&gsrsearch="+encodeURIComponent(term)+"&prop=extracts&explaintext=1&exchars=8000";
  const j=await getJSON(u,9000);
  const p=Object.values((j.query&&j.query.pages)||{})[0];
  if(!p||!p.extract)throw new Error("no article");
  const m=new Map();
  (p.extract.toLowerCase().match(/[a-z]{4,}/g)||[]).forEach(w=>{if(okWord(w)&&!WSTOP.has(w))m.set(w,(m.get(w)||0)+1)});
  return [...m].map(([w,n])=>({w,n})).sort((a,b)=>b.n-a.n);
}
async function expand(term){
  const key="gw_x2_"+term,c0=cacheGet(key);if(c0)return c0;
  const q=encodeURIComponent(term),tidy=a=>a.map(x=>clean(x.word)).filter(okWord);
  const [ml,trg,wk]=await Promise.all([
    getJSON("https://api.datamuse.com/words?ml="+q+"&max=40").then(tidy).catch(()=>null),
    getJSON("https://api.datamuse.com/words?rel_trg="+q+"&max=30").then(tidy).catch(()=>null),
    wikiWords(term).catch(()=>null)
  ]);
  const dm=(ml||trg)?[...new Set([...(ml||[]),...(trg||[])])]:null;
  if(!dm)svc.dm=false;if(!wk)svc.wk=false;
  const strong=[],weak=[];
  if(dm&&wk){
    const ws=new Set(wk.map(x=>stem(x.w))),ds=new Set(dm.map(stem));
    dm.forEach(w=>(ws.has(stem(w))?strong:weak).push(w));
    wk.forEach(x=>{if(x.n>=3&&!ds.has(stem(x.w)))weak.push(x.w)});
  }else if(dm){
    const a=new Set(ml||[]),b=new Set(trg||[]);
    dm.forEach((w,i)=>((a.has(w)&&b.has(w))||i<6?strong:weak).push(w));
  }else if(wk){
    wk.forEach(x=>{if(x.n>=5)strong.push(x.w);else if(x.n>=2)weak.push(x.w)});
  }
  const d={strong,weak};if(dm&&wk)cacheSet(key,d);return d;
}
async function holidayTerms(m){
  try{
    const y=new Date().getFullYear(),key="gw_h_"+COUNTRY+y;let list=cacheGet(key);
    if(!list){list=await getJSON("https://date.nager.at/api/v3/PublicHolidays/"+y+"/"+COUNTRY);cacheSet(key,list)}
    return list.filter(h=>h.global!==false&&parseInt(h.date.slice(5,7))-1===m&&!/bank holiday|boxing/i.test(h.name))
      .map(h=>clean(h.name).replace(/[^a-z ]/g," ").replace(/\bday\b/g,"").replace(/\s+/g," ").trim())
      .filter(n=>n&&n.split(" ").length<=2&&okWord(n));
  }catch(_){svc.nh=false;return []}
}
async function buildQuery(raw){
  svc={dm:true,wk:true,nh:true};
  let base=[];
  for(const t of raw.split(",").map(x=>x.trim()).filter(Boolean)){
    const mi=monthIndex(t);
    if(mi>=0)base.push(SEASON[mi],...(OBS[mi]||[]),...await holidayTerms(mi));
    else base.push(clean(t));
  }
  base=[...new Set(base)];
  const ex=await Promise.all(base.map(expand));
  const strong=new Set(),weak=new Set();
  ex.forEach(e=>{e.strong.forEach(w=>strong.add(w));e.weak.forEach(w=>weak.add(w))});
  base.forEach(b=>{strong.delete(b);weak.delete(b)});
  strong.forEach(w=>weak.delete(w));
  return {base,strong,weak};
}
// ---------- data ----------
let games=[];
function norm(raw){
  let arr=Array.isArray(raw)?raw:(raw&&(raw.games||raw.items||raw.events||Object.values(raw).find(Array.isArray)))||[];
  return arr.map(g=>{
    if(typeof g==="string") return {title:g,genre:"",description:""};
    const lk={};for(const k in g)lk[k.toLowerCase()]=g[k];
    const dec=s=>s.replace(/&amp;/g,"&").replace(/&quot;/g,'"').replace(/&#39;|&apos;/g,"'").replace(/&lt;/g,"<").replace(/&gt;/g,">");
    const pick=(...ks)=>{for(const k of ks){const v=lk[k];if(v!=null&&v!=="")return dec(Array.isArray(v)?v.join(", "):String(v))}return ""};
    return {title:pick("title","name","game","summary"),
      genre:pick("genre","genres","genres[*].description","tags","category","categories"),
      description:pick("description","short description","desc","summary_text","notes","about","details"),
      date:pick("release date","date"),url:pick("steam url","url"),trailer:pick("trailer","video")};
  }).filter(g=>g.title);
}
function setGames(a){games=a;document.getElementById("count").textContent=games.length+" games loaded"}
try{const s=localStorage.getItem("gw_games");setGames(s?norm(JSON.parse(s)):norm(SAMPLE))}catch(e){setGames(norm(SAMPLE))}
const $=id=>document.getElementById(id);
$("load").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{const raw=JSON.parse(t);const g=norm(raw);
    if(!g.length){alert("Couldn’t find any games in that file.");return}
    setGames(g);try{localStorage.setItem("gw_games",JSON.stringify(g))}catch(_){}
  }).catch(()=>alert("That file isn’t valid JSON."));
};
$("reset").onclick=()=>{try{localStorage.removeItem("gw_games")}catch(_){}setGames(norm(SAMPLE))};
const SHEET="https://opensheet.elk.sh/1ritGjWTo1Vr0kO3veyx0rXAMoC4PCN4d6SqHuySyoZM/10";
function ingest(t){try{const g=norm(JSON.parse(t));if(!g.length){alert("No games found in that data.");return}setGames(g);try{localStorage.setItem("gw_games",JSON.stringify(g))}catch(_){}$("pbox").hidden=true;return true}catch(e){alert("That doesn’t look like valid JSON.")}}
$("sync").onclick=()=>{$("count").textContent="syncing…";fetch(SHEET).then(r=>r.text()).then(t=>{if(!ingest(t))setGames(games)}).catch(()=>{setGames(games);$("pbox").hidden=false;alert("This page can’t reach the sheet directly. Open the sheet link, copy everything, and paste it into the box.")})};
$("paste").onclick=()=>{$("pbox").hidden=!$("pbox").hidden};
$("pgo").onclick=()=>ingest($("pj").value);
// Auto-sync from the sheet when hosted on a normal website
if(location.protocol.startsWith("http")){fetch(SHEET).then(r=>r.json()).then(raw=>{const g=norm(raw);if(g.length){setGames(g);try{localStorage.setItem("gw_games",JSON.stringify(g))}catch(_){}}}).catch(()=>{})}
// ---------- matching ----------
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const reCache=new Map();
function hit(text,t){
  let r=reCache.get(t);
  if(!r){r=t.length<=4?new RegExp("\\b"+esc(t)+"(?:s|es)?\\b","i"):new RegExp("\\b"+esc(t.replace(/s$/,"")),"i");reCache.set(t,r)}
  return r.test(text);
}
let direct=[],related=[],current="",pool=[],Q=null;
function search(){
  direct=[];related=[];
  for(const g of games){
    const hay=clean(g.title+" "+g.genre+" "+g.description);
    g._why="";
    if(Q.base.some(t=>hit(hay,t))){direct.push(g);continue}
    let score=0;const why=[];
    for(const t of Q.strong)if(hit(hay,t)){score+=2;why.push(t)}
    for(const t of Q.weak)if(hit(hay,t)){score+=1;why.push(t)}
    if(score>=2){g._why=why.slice(0,4).join(", ");related.push({g,score})}
  }
  related.sort((a,b)=>b.score-a.score);
  related=related.map(x=>x.g);
}
function buildPool(){
  pool=direct.concat($("rel").checked?related:[]);
  $("stats").textContent=`“${current}” · ${direct.length} direct`+($("rel").checked?` + ${related.length} related`:"");
}
// ---------- wheel ----------
const cv=$("cv"),ctx=cv.getContext("2d");
let rot=0,spinning=false,raf=0,winner=-1;
function size(){const d=devicePixelRatio||1,w=cv.clientWidth;cv.width=cv.height=w*d;ctx.setTransform(d,0,0,d,0,0)}
function draw(){
  const w=cv.clientWidth,c=w/2,r=c-10,n=pool.length;
  ctx.clearRect(0,0,w,w);
  if(!n){$("live").textContent="";ctx.fillStyle="rgba(0,0,0,.4)";ctx.font="20px Georgia";ctx.textAlign="center";ctx.fillText("No games found",c,c-80);return}
  const step=2*Math.PI/n,pal=PAL[season];
  const fs=Math.min(18,r*step*0.62),labels=fs>=8;
  for(let i=0;i<n;i++){
    const a=rot+i*step;
    ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+step);ctx.closePath();
    ctx.fillStyle=pal[i%pal.length];ctx.fill();
    ctx.strokeStyle="rgba(255,255,255,.8)";ctx.lineWidth=n>60?0.6:2;ctx.stroke();
    if(!labels)continue;
    ctx.save();ctx.translate(c,c);ctx.rotate(a+step/2);
    const dk=lum(pal[i%pal.length])>0.3;
    ctx.fillStyle=dk?"#1b1b1b":"#fff";ctx.shadowColor=dk?"transparent":"rgba(0,0,0,.45)";ctx.shadowBlur=dk?0:3;
    ctx.font=`700 ${fs}px Georgia`;
    ctx.textAlign="right";ctx.textBaseline="middle";
    let t=pool[i].title;if(t.length>22)t=t.slice(0,21)+"…";
    ctx.fillText(t,r-14,0);ctx.restore();
  }
  ctx.beginPath();ctx.arc(c,c,r,0,7);ctx.lineWidth=8;ctx.strokeStyle="#fff";ctx.stroke();
  const ix=Math.floor((((-Math.PI/2-rot)%(2*Math.PI))+2*Math.PI)%(2*Math.PI)/step)%n;
  $("live").textContent=labels?"":pool[ix].title;
  // pointer
  ctx.beginPath();ctx.moveTo(c-14,2);ctx.lineTo(c+14,2);ctx.lineTo(c,32);ctx.closePath();
  ctx.fillStyle="#d22";ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.stroke();ctx.fill();
}
function lum(h){const n=parseInt(h.slice(1),16),f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255)}
let last=0;
function idle(t){
  if(spinning)return;
  rot+=(t-last)*0.0002;last=t;draw();raf=requestAnimationFrame(idle);
}
function startIdle(){cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(idle)}
function spin(){
  if(spinning||!pool.length)return;
  spinning=true;cancelAnimationFrame(raf);$("spin").disabled=true;$("result").innerHTML="";
  const start=rot,total=(6+Math.random()*3)*2*Math.PI+Math.random()*2*Math.PI,dur=5200,t0=performance.now();
  (function f(t){
    const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,4);
    rot=start+total*e;draw();
    if(p<1)return requestAnimationFrame(f);
    spinning=false;$("spin").disabled=false;finish();startIdle();
  })(t0);
}
function finish(){
  const n=pool.length,step=2*Math.PI/n;
  let ang=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
  winner=Math.floor(ang/step)%n;
  const g=pool[winner],isDirect=direct.includes(g);
  $("result").innerHTML=`<h2></h2><p></p><button class="pill" id="rm">remove & spin again</button>`;
  $("result").querySelector("h2").textContent="🎉 "+g.title;
  const p=$("result").querySelector("p");
  p.textContent=(g.genre?g.genre+" · ":"")+(g.date?"releases "+g.date+" · ":"")+(isDirect?"keyword match":"related ("+(g._why||"")+")");
  if(/^https?:\/\//.test(g.url||"")){const a=document.createElement("a");a.href=g.url;a.target="_blank";a.rel="noopener";a.textContent=" · Steam page";a.style.color="var(--accent)";p.appendChild(a)}
  $("rm").onclick=()=>{pool.splice(winner,1);$("result").innerHTML="";draw()};
  setTimeout(()=>showPop(g),400);
}
function ytId(u){const m=(u||"").match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m&&m[1]}
function fmtDate(s){
  const m=(s||"").match(/(\d{1,2})\s+([A-Za-z]{3})/);if(!m)return s||"";
  const full=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const i=full.findIndex(x=>x.slice(0,3).toLowerCase()===m[2].toLowerCase());
  return i<0?s:(+m[1])+" "+full[i]+" "+new Date().getFullYear();
}
function hidePop(){$("pop").classList.remove("show");$("popcard").textContent=""}
function showPop(g){
  const c=$("popcard");c.textContent="";
  const add=(tag,txt,cls)=>{const e=document.createElement(tag);if(txt!=null)e.textContent=txt;if(cls)e.className=cls;c.appendChild(e);return e};
  add("button","×","x").onclick=hidePop;
  add("h2",g.title+(g.genre?" ("+g.genre+")":""));
  add("div",fmtDate(g.date)||"Release date unknown","pd");
  const id=ytId(g.trailer);
  if(id||/\.mp4/.test(g.trailer||"")){
    const v=add("div",null,"vid");
    if(id){const f=document.createElement("iframe");f.referrerPolicy="strict-origin-when-cross-origin";f.src="https://www.youtube.com/embed/"+id+"?rel=0&playsinline=1"+(location.origin.startsWith("http")?"&origin="+encodeURIComponent(location.origin):"");f.allowFullscreen=true;f.setAttribute("allow","fullscreen; picture-in-picture");f.title="Trailer";v.appendChild(f)}
    else{const m=document.createElement("video");m.src=g.trailer;m.controls=true;m.playsInline=true;v.appendChild(m)}
    if(id){const s=add("p","Video not loading? ","sm");const a=document.createElement("a");a.href=g.trailer;a.target="_blank";a.rel="noopener";a.textContent="Watch on YouTube";s.appendChild(a)}
  }else add("p","No trailer listed for this game.","sm");
  if(/^https?:\/\//.test(g.url||"")){const p=add("p",null);const a=document.createElement("a");a.href=g.url;a.target="_blank";a.rel="noopener";a.textContent="Store page →";p.appendChild(a)}
  add("p",g.description||"No description available.","desc");
  $("pop").classList.add("show");
}
$("pop").onclick=e=>{if(e.target.id==="pop")hidePop()};
$("spin").onclick=spin;
$("rel").onchange=()=>{buildPool();$("result").innerHTML="";draw()};
// ---------- flow ----------
function confetti(){
  document.querySelectorAll(".fx").forEach(e=>e.remove());
  for(let i=0;i<16;i++){
    const s=document.createElement("span");s.className="fx";
    s.textContent=FX[season][i%3];
    s.style.left=Math.random()*100+"vw";s.style.fontSize=(14+Math.random()*18)+"px";
    s.style.animationDuration=(9+Math.random()*10)+"s";s.style.animationDelay=(-Math.random()*15)+"s";
    document.body.appendChild(s);
  }
}
async function go(k){
  $("kw").disabled=true;$("hint").textContent="finding related words…";
  try{Q=await buildQuery(k)}catch(e){Q={base:[clean(k)],strong:new Set(),weak:new Set()}}
  $("kw").disabled=false;$("hint").textContent="press enter";
  current=k;search();buildPool();
  $("start").style.display="none";$("app").style.display="flex";
  document.body.classList.add("themed");confetti();
  size();$("result").innerHTML=pool.length?"":"<p>Nothing matched. Try another keyword.</p>";
  const st=[];
  if(!svc.dm&&!svc.wk)st.push("word services unreachable, exact matches only");
  else{if(!svc.wk)st.push("Wikipedia unavailable, using Datamuse only");if(!svc.dm)st.push("Datamuse unavailable, using Wikipedia only")}
  $("terms").textContent="Searching: "+Q.base.slice(0,8).join(", ")+(st.length?" · "+st.join(" · "):"");
  draw();startIdle();
}
$("kw").addEventListener("keydown",e=>{if(e.key==="Enter"&&$("kw").value.trim())go($("kw").value)});
$("back").onclick=()=>{
  cancelAnimationFrame(raf);spinning=false;$("spin").disabled=false;
  $("app").style.display="none";$("start").style.display="flex";
  document.body.classList.remove("themed");
  document.querySelectorAll(".fx").forEach(e=>e.remove());
  $("kw").value="";$("kw").focus();
};
addEventListener("resize",()=>{if($("app").style.display==="flex"){size();draw()}});
</script>
